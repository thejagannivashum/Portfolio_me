<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#070913" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
  
  <!-- Tensor Reticle Ticks -->
  <path d="M12 20 V12 H20" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M52 20 V12 H44" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M12 44 V52 H20" stroke="#7928ca" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M52 44 V52 H44" stroke="#7928ca" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8" />

  <!-- Monogram J with Precision Crosshair -->
  <path d="M26 22 H42 M36 22 V38 C36 43 32 46 26 45 C22 44 20 41 20 38" stroke="url(#grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)" />
  <circle cx="36" cy="22" r="3" fill="#00f2fe" />
</svg>